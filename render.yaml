# Render Blueprint — Python web service.
# Deploy: Render dashboard → New + → Blueprint → pick this repo.
# Runs server.py, which serves the repo root and applies the same clean-URL
# rewrites and cache headers as the Apache .htaccess.
services:
  - type: web
    name: maxmiesenllc
    runtime: python
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
